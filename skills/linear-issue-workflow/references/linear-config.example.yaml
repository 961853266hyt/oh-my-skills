workspace:
  name: "Your workspace"

team:
  name: "Your team"
  key: "TEAM"

project:
  name: "Your project"

assignee:
  default: null

priority:
  enabled: true
  default: null

default_template: "web-agent"

templates:
  web-agent:
    name: "Web issue for agent"
    service: "web"
    defaults:
      labels: []
      state: "Todo"
      project: "Your project"
      assignee: null
      priority: null
      links:
        attach_page_url: true
        attach_figma_url: true
        attach_screenshot_urls: true
    description_template: |
      Tool names in this template are examples, not requirements. Use the equivalent tools already adopted by your team.

      ## 1. Buggy DOM Node Context

      Tip for humans: use react-grab, Chrome DevTools, or a similar tool to copy and paste the relevant problem node context here.

      ## 2. Steps to Reproduce

      Describe the steps needed to reproduce this issue.

      ## 3. Figma MCP Link

      Tip for humans: copy and paste the MCP link for the corresponding design node here.

      ## 4. Page URL

      Provide the URL of the page where the bug appears.

      ## 5. Expected Behavior

      Describe the expected behavior for this issue.
